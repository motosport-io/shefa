<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" role="img" aria-label="GOUPiL">
  <defs>
    <radialGradient id="gp-ring" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="55%" stop-color="#c7ccd2"/>
      <stop offset="100%" stop-color="#7d848c"/>
    </radialGradient>
    <radialGradient id="gp-blue" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3aa0e8"/>
      <stop offset="100%" stop-color="#0f5fb0"/>
    </radialGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(100 100)">
    <circle r="90" fill="url(#gp-ring)"/>
    <circle r="78" fill="#5a6068"/>
    <circle r="70" fill="url(#gp-blue)"/>
    <!-- stylised fox head -->
    <g fill="#cfd8e2" stroke="#0c4f93" stroke-width="3" stroke-linejoin="round">
      <path d="M-46,-44 L-14,-18 L-30,8 Z"/>
      <path d="M46,-44 L14,-18 L30,8 Z"/>
      <path d="M-30,-6 L0,-22 L30,-6 L18,30 L0,46 L-18,30 Z"/>
    </g>
    <path d="M-9,6 L0,16 L9,6 Z" fill="#0c4f93"/>
  </g>
  <text x="210" y="132" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800"
        letter-spacing="2" fill="#111111">GOUP<tspan font-style="italic">i</tspan>L</text>
</svg>
